<title>Fyzikální vzorce 6.–7. ročník</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=STIX+Two+Text:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet">
<style>
/* Layout: horní lišta + dashboard karet podle skupin; kapitola = jeden sloupec se sekcemi Teorie → Simulace → Neznámá → Příklady.
   Tokeny vychází z Kozak Design System (tmavý = výchozí), světlý režim odvozen ze stejné podzimní palety. */
:root{
  --bg-top:#1b120e; --bg-bottom:#3a2216;
  --orb-1:rgba(193,84,46,.28); --orb-2:rgba(124,140,74,.20);
  --panel:rgba(20,13,9,.45); --panel-strong:rgba(20,13,9,.72);
  --line:rgba(232,169,74,.25); --line-soft:rgba(245,236,224,.09);
  --text:#f5ece0; --muted:rgba(245,236,224,.64);
  --amber:#e8a94a; --amber-2:#f4c873; --rust:#e2703a; --moss:#9db35c; --info:#8fc3c3; --danger:#e0705c;
  --btn:#7a3f1e; --btn-h:#9a4f26; --btn-text:#f5ece0; --chip:rgba(255,255,255,.07); --chip-h:rgba(255,255,255,.13);
  --code-bg:#0d0906; --shadow:rgba(13,9,6,.45);
  --sim-bg:rgba(13,9,6,.55); --sim-grid:rgba(245,236,224,.08);
  --water:rgba(91,138,138,.55); --water-line:#8fc3c3; --ground:#5a3a26; --snow:#e9e4dc;
  --key-bg:rgba(232,169,74,.10); --key-bd:#e8a94a;
  --succ-bg:rgba(138,154,74,.15); --succ-bd:rgba(138,154,74,.4);
  --warn-bg:rgba(217,98,43,.15); --warn-bd:rgba(217,98,43,.4);
  --info-bg:rgba(91,138,138,.15); --info-bd:rgba(91,138,138,.4);
  /* barvy materiálů v simulacích – stejné v obou režimech */
  --m-wood:#b07a45; --m-ice:#cfe7ee; --m-alu:#c8ccd0; --m-iron:#6f6a66; --m-gold:#e5b632; --m-oil:rgba(214,170,60,.6); --m-hg:rgba(190,195,200,.85); --m-alc:rgba(170,200,220,.45); --m-sea:rgba(60,120,140,.6);
  --font-ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-math:'STIX Two Text','Cambria Math',Cambria,'Times New Roman',serif;
  --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-full:9999px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg-top:#f8f0e5; --bg-bottom:#ead6bf;
  --orb-1:rgba(226,112,58,.16); --orb-2:rgba(124,140,74,.14);
  --panel:rgba(255,250,244,.62); --panel-strong:rgba(255,250,244,.92);
  --line:rgba(168,102,26,.30); --line-soft:rgba(42,26,18,.10);
  --text:#2a1a12; --muted:rgba(42,26,18,.68);
  --amber:#9a5a0c; --amber-2:#8a4f0a; --rust:#b0441b; --moss:#4f6125; --info:#2b6565; --danger:#a52a16;
  --btn:#7a3f1e; --btn-h:#9a4f26; --btn-text:#fbf3e9; --chip:rgba(42,26,18,.06); --chip-h:rgba(42,26,18,.12);
  --code-bg:#fffaf3; --shadow:rgba(90,50,20,.14);
  --sim-bg:rgba(255,252,247,.8); --sim-grid:rgba(42,26,18,.08);
  --water:rgba(91,138,138,.35); --water-line:#2b6565; --ground:#c9a27c; --snow:#ffffff;
  --key-bg:rgba(154,90,12,.07); --key-bd:#b8721a;
  --succ-bg:rgba(124,140,74,.14); --succ-bd:rgba(79,97,37,.4);
  --warn-bg:rgba(217,98,43,.12); --warn-bd:rgba(176,68,27,.4);
  --info-bg:rgba(91,138,138,.13); --info-bd:rgba(43,101,101,.4);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg-top:#f8f0e5; --bg-bottom:#ead6bf;
  --orb-1:rgba(226,112,58,.16); --orb-2:rgba(124,140,74,.14);
  --panel:rgba(255,250,244,.62); --panel-strong:rgba(255,250,244,.92);
  --line:rgba(168,102,26,.30); --line-soft:rgba(42,26,18,.10);
  --text:#2a1a12; --muted:rgba(42,26,18,.68);
  --amber:#9a5a0c; --amber-2:#8a4f0a; --rust:#b0441b; --moss:#4f6125; --info:#2b6565; --danger:#a52a16;
  --btn:#7a3f1e; --btn-h:#9a4f26; --btn-text:#fbf3e9; --chip:rgba(42,26,18,.06); --chip-h:rgba(42,26,18,.12);
  --code-bg:#fffaf3; --shadow:rgba(90,50,20,.14);
  --sim-bg:rgba(255,252,247,.8); --sim-grid:rgba(42,26,18,.08);
  --water:rgba(91,138,138,.35); --water-line:#2b6565; --ground:#c9a27c; --snow:#ffffff;
  --key-bg:rgba(154,90,12,.07); --key-bd:#b8721a;
  --succ-bg:rgba(124,140,74,.14); --succ-bd:rgba(79,97,37,.4);
  --warn-bg:rgba(217,98,43,.12); --warn-bd:rgba(176,68,27,.4);
  --info-bg:rgba(91,138,138,.13); --info-bd:rgba(43,101,101,.4);
  color-scheme:light;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{
  margin:0;min-height:100vh;font-family:var(--font-ui);color:var(--text);font-size:1rem;line-height:1.6;
  background:
    radial-gradient(40rem 30rem at 85% 10%, var(--orb-1), transparent 70%),
    radial-gradient(36rem 28rem at 5% 70%, var(--orb-2), transparent 70%),
    linear-gradient(160deg,var(--bg-top) 0%,var(--bg-bottom) 100%);
  background-color:var(--bg-top);
  background-attachment:fixed;
}
::selection{background:var(--amber);color:var(--bg-top)}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:clamp(2rem,5vw,2.75rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(1.5rem,3.6vw,2.1rem);font-weight:700;letter-spacing:-.01em}
h3{font-size:1.25rem;font-weight:700}
p{margin:0}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--amber-2)}
.muted{color:var(--muted)}
a{color:var(--amber)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}

/* matematika */
.f{font-family:var(--font-math);font-weight:500;white-space:nowrap}
.f i{font-style:italic}
.f sub{font-size:.62em;font-style:normal;vertical-align:-.35em;line-height:0}
.f sup{font-size:.62em;line-height:0}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.15}
.frac>span{padding:0 .2em}
.frac>span:first-child{border-bottom:.07em solid currentColor;padding-bottom:.06em}
.frac>span:last-child{padding-top:.06em}
.u{font-style:normal}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;
  padding:12px max(16px,calc((100vw - 1120px)/2));background:var(--panel-strong);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line-soft)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.02rem;color:var(--text);text-decoration:none;margin-right:auto;min-width:0}
.brand .dot{width:11px;height:11px;border-radius:50%;background:var(--amber);box-shadow:0 0 14px var(--amber);flex-shrink:0}
.brand span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--chip);color:var(--text);font-weight:700;font-size:.88rem;cursor:pointer;transition:background .2s;text-decoration:none}
.iconbtn:hover{background:var(--chip-h)}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.page{max-width:1120px;margin:0 auto;padding-block:40px 96px;padding-inline:16px}
@media (min-width:700px){.page{padding-inline:24px}}

.glass{background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line-soft);
  border-radius:var(--r-lg);box-shadow:0 8px 32px var(--shadow)}

/* dashboard */
.hero{display:grid;gap:14px;max-width:760px;margin-bottom:36px}
.hero .lead{font-size:1.12rem;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:20px;margin-bottom:44px}
.steps h3{grid-column:1/-1;font-size:1rem;margin-bottom:4px}
.step{display:grid;gap:4px;padding:12px;border-radius:var(--r-md);background:var(--chip);min-width:0}
.step b{font-family:var(--font-mono);color:var(--amber);font-size:.8rem}
.step strong{font-size:.95rem}
.step span{font-size:.84rem;color:var(--muted);line-height:1.45}
@media (max-width:860px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.steps{grid-template-columns:1fr}}

.group{margin-bottom:36px}
.group-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.group-head h2{font-size:1.25rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:20px;text-decoration:none;color:var(--text);
  transition:transform .2s,border-color .2s,background .2s;min-width:0}
.card:hover{transform:translateY(-3px);border-color:var(--line)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .num{font-family:var(--font-mono);font-size:.78rem;color:var(--muted)}
.card .formula{font-size:1.85rem;color:var(--amber-2);padding:10px 0 4px;min-height:74px;display:flex;align-items:center}
.card h3{font-size:1.06rem}
.card p{font-size:.88rem;color:var(--muted);line-height:1.5}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:3px 11px;border-radius:var(--r-full);border:1px solid transparent;white-space:nowrap}
.badge .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.b-succ{background:var(--succ-bg);border-color:var(--succ-bd);color:var(--moss)}
.b-warn{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--rust)}
.b-info{background:var(--info-bg);border-color:var(--info-bd);color:var(--info)}
.b-muted{background:var(--chip);border-color:var(--line-soft);color:var(--muted)}

/* kapitola */
.ch-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 28px;align-items:center;padding:28px;margin-bottom:16px}
.ch-head .big{font-size:clamp(2.2rem,6vw,3.4rem);color:var(--amber-2);padding:8px 20px;border-radius:var(--r-md);background:var(--code-bg);border:1px solid var(--line)}
.ch-head .meta{display:grid;gap:10px;min-width:0}
@media (max-width:700px){.ch-head{grid-template-columns:1fr;padding:20px}.ch-head .big{justify-self:start;max-width:100%;overflow-x:auto}}
.subnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:10;display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:8px;margin-bottom:28px}
.subnav a{white-space:nowrap;flex-shrink:0;padding:7px 14px;border-radius:var(--r-sm);color:var(--muted);text-decoration:none;font-weight:700;font-size:.88rem}
.subnav a:hover{color:var(--text);background:var(--chip)}
.sec{padding:28px;margin-bottom:22px;display:grid;gap:18px}
@media (max-width:600px){.sec{padding:18px}}
.sec-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.prose{display:grid;gap:12px;max-width:68ch;font-size:1.05rem}
.prose strong{color:var(--amber-2)}
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.box{padding:16px 18px;border-radius:var(--r-md);background:var(--chip);border:1px solid var(--line-soft);display:grid;gap:8px;min-width:0}
.box h4{font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--amber-2)}
.box ul{margin:0;padding-left:1.15em;display:grid;gap:6px}
.tbl-wrap{overflow-x:auto}
table.sym{border-collapse:collapse;width:100%;font-size:.95rem}
.sym th{text-align:left;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 10px;border-bottom:1px solid var(--line-soft)}
.sym td{padding:8px 10px;border-bottom:1px solid var(--line-soft)}
.sym td:first-child{font-size:1.2rem;color:var(--amber-2);width:64px}
.sym td:last-child{font-family:var(--font-mono);font-size:.86rem;white-space:nowrap}
.callout{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r-md);background:var(--info-bg);border:1px solid var(--info-bd);font-size:.97rem}
.callout svg{width:20px;height:20px;flex-shrink:0;margin-top:3px;fill:none;stroke:var(--info);stroke-width:2}

/* simulace */
.sim{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:900px){.sim{grid-template-columns:1fr}}
.stage{background:var(--sim-bg);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.stage svg text{font-family:var(--font-ui);fill:var(--text);font-size:14px}
.stage svg .t-m{fill:var(--muted);font-size:12px}
.stage svg .t-f{font-family:var(--font-math);font-style:italic;font-size:18px}
.stage svg .t-a{fill:var(--amber-2);font-weight:700}
.stage svg .t-r{fill:var(--rust);font-weight:700}
.stage svg .t-i{fill:var(--info);font-weight:700}
.ctrls{display:grid;gap:16px;padding:18px}
.ctl{display:grid;gap:6px}
.ctl label,.ctl .lbl{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:.9rem}
.ctl output{font-family:var(--font-mono);color:var(--amber-2);font-size:.86rem;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--amber);height:24px;cursor:pointer}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:6px 11px;border-radius:var(--r-sm);border:1px solid var(--line-soft);background:var(--chip);color:var(--text);font-weight:600;font-size:.84rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-text);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:var(--r-sm);border:none;cursor:pointer;
  font-weight:700;font-size:.9rem;background:var(--btn);color:var(--btn-text);transition:background .2s,transform .1s}
.btn:hover{background:var(--btn-h)}
.btn:active{transform:scale(.97)}
.btn.sec-b{background:var(--chip);color:var(--text);border:1px solid var(--line)}
.btn.sec-b:hover{background:var(--chip-h)}
.readout{padding:16px 18px;border-radius:var(--r-md);background:var(--code-bg);border:1px solid var(--line);display:grid;gap:8px;font-size:1.05rem;overflow-x:auto}
.readout .f{font-size:1.2rem}
.readout .note{font-size:.9rem;color:var(--muted);font-family:var(--font-ui)}

/* vyjádření neznámé */
.rearr{display:grid;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips button{min-width:52px;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--chip);color:var(--text);cursor:pointer;font-size:1.25rem}
.chips button[aria-pressed="true"]{background:var(--btn);color:var(--btn-text);border-color:transparent}
.rearr-out{padding:18px 20px;border-radius:var(--r-md);background:var(--code-bg);border:1px solid var(--line);display:grid;gap:8px}
.rearr-out .f{font-size:1.8rem;color:var(--amber-2);overflow-x:auto}
.rearr-out p{color:var(--muted);font-size:.95rem}

/* příklady */
.examples{display:grid;gap:16px}
.ex{padding:20px 22px;border-radius:var(--r-md);background:var(--chip);border:1px solid var(--line-soft);display:grid;gap:14px}
.ex-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ex-head h3{font-size:1.05rem;margin-right:auto}
.ex .task{font-size:1.06rem;max-width:72ch}
.ex ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ex li{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;padding:12px 14px;border-radius:var(--r-sm);background:var(--panel);border:1px solid var(--line-soft);animation:pop .3s ease}
.ex li .k{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--amber-2);padding-top:4px}
.ex li .v{min-width:0;overflow-x:auto;line-height:1.7}
.ex li .v .f{font-size:1.15rem}
.ex li.ans{background:var(--succ-bg);border-color:var(--succ-bd)}
.ex li.ans .k{color:var(--moss)}
.ex .actions{display:flex;gap:8px;flex-wrap:wrap}
.zapis{display:flex;flex-wrap:wrap;gap:6px 22px}
.zapis .f{font-size:1.12rem}
@media (max-width:560px){.ex li{grid-template-columns:1fr;gap:4px}.ex{padding:16px}}
/* zvýrazněná úloha na vyjádření neznámé */
.ex-key{background:var(--key-bg);border:2px solid var(--key-bd);box-shadow:0 0 0 5px var(--key-bg),0 10px 30px var(--shadow);padding:24px}
.ex-key .ex-head h3{font-size:1.25rem}
.ex-key .star{width:26px;height:26px;flex-shrink:0;fill:var(--key-bd)}
.b-key{background:var(--key-bd);color:var(--bg-top);border-color:transparent}
.ex-key .rule{display:grid;gap:4px;padding:12px 14px;border-radius:var(--r-sm);border:1px dashed var(--key-bd);font-size:.97rem}
.ex-key .rule strong{color:var(--amber-2)}
.der{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.der .f{font-size:1.35rem}
.der .op{font-family:var(--font-math);font-size:1.15rem;color:var(--rust);font-weight:600;padding:2px 10px;border-radius:var(--r-sm);background:var(--warn-bg);border:1px solid var(--warn-bd)}
.why{color:var(--muted);font-size:.95rem;margin-top:4px}
.ex li.fin{border-color:var(--key-bd)}
.ex li.fin .der .f{color:var(--amber-2);font-size:1.5rem}
.cx{text-decoration:line-through;text-decoration-color:var(--rust);text-decoration-thickness:2px;opacity:.75}
.ex li.ans .v .f{font-size:1.3rem}
.key-note{display:flex;gap:12px;align-items:center;padding:14px 18px;margin-bottom:36px;border-radius:var(--r-md);background:var(--key-bg);border:2px solid var(--key-bd)}
.key-note svg{width:26px;height:26px;flex-shrink:0;fill:var(--key-bd)}
@keyframes pop{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}

.ch-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:28px}
.done-toggle{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.done-toggle input{width:20px;height:20px;accent-color:var(--moss)}

.spin{transform-box:fill-box;transform-origin:center;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(-360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<header class="topbar">
  <a class="brand" href="#"><span class="dot"></span><span>Fyzika · vzorce</span></a>
  <a class="iconbtn" id="homeBtn" href="#" hidden><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Přehled</a>
  <button class="iconbtn" id="themeBtn" type="button" aria-label="Přepnout světlý / tmavý režim">
    <svg id="themeIcon" viewBox="0 0 24 24"></svg><span id="themeLbl">Režim</span>
  </button>
</header>
<main class="page" id="app"></main>

<script>
/* ---------- pomocníci ---------- */
const $=s=>document.querySelector(s);
const fmt=(n,d=2)=>Number(n).toLocaleString('cs-CZ',{maximumFractionDigits:d});
const I=s=>`<i>${s}</i>`;
const S=(s,b)=>`<i>${s}</i><sub>${b}</sub>`;
const fr=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const F=h=>`<span class="f">${h}</span>`;

/* šipka v SVG */
function arrow(x1,y1,x2,y2,color,w=4){
  const L=Math.hypot(x2-x1,y2-y1); if(L<2) return '';
  const ux=(x2-x1)/L, uy=(y2-y1)/L, h=Math.min(14,L*.6), hw=h*.55;
  const bx=x2-ux*h, by=y2-uy*h;
  return `<line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>
  <polygon points="${x2},${y2} ${bx-uy*hw},${by+ux*hw} ${bx+uy*hw},${by-ux*hw}" fill="${color}"/>`;
}
function spring(x,y1,y2,coils=9,w=14){
  let d=`M${x},${y1} l0,6`; const seg=(y2-y1-12)/(coils*2);
  for(let i=0;i<coils*2;i++){ d+=` L${x+(i%2?-w:w)},${y1+6+seg*(i+.5)}`; }
  d+=` L${x},${y2-6} L${x},${y2}`;
  return `<path d="${d}" fill="none" stroke="var(--muted)" stroke-width="2.2" stroke-linejoin="round"/>`;
}

    ['Převod','Hodinu převedeme na minuty:'+F(' 0,25 h = 0,25 · 60 min = 15 min')],
    ['Odpověď','Cesta jí trvá <strong>15 minut</strong>.']]}
 ],
 sim:{defs:[
   {type:'range',id:'v',label:'Rychlost auta',min:5,max:130,step:5,value:50,unit:'km/h'},
   {type:'range',id:'t',label:'Uplynulý čas',min:0,max:60,step:1,value:20,unit:'s'},
   {type:'play',target:'t',label:'Spustit jízdu',duration:6000}],
  hint:'Pusť jízdu a sleduj graf: při vyšší rychlosti je čára strmější. Za stejný čas ujede rychlejší auto delší dráhu.',
  draw(s){
   const vm=s.v/3.6, dist=vm*s.t, MAX=2200, X=x=>40+520*x/MAX;
   const cx=X(dist);
   let ticks=''; for(let k=0;k<=2000;k+=500){ticks+=`<line x1="${X(k)}" x2="${X(k)}" y1="96" y2="104" stroke="var(--muted)"/><text x="${X(k)}" y="122" text-anchor="middle" class="t-m">${k} m</text>`;}
   const gx=t=>70+490*t/60, gy=v=>300-130*v/MAX;
   let grid=''; for(let k=0;k<=60;k+=10){grid+=`<line x1="${gx(k)}" x2="${gx(k)}" y1="165" y2="300" stroke="var(--sim-grid)"/><text x="${gx(k)}" y="316" text-anchor="middle" class="t-m">${k} s</text>`;}
   for(let k=0;k<=2000;k+=1000){grid+=`<line x1="70" x2="560" y1="${gy(k)}" y2="${gy(k)}" stroke="var(--sim-grid)"/><text x="62" y="${gy(k)+4}" text-anchor="end" class="t-m">${k}</text>`;}
   const svg=svgOpen(330)+
    `<rect x="30" y="66" width="540" height="30" rx="4" fill="var(--chip-h)"/>
     <line x1="40" x2="560" y1="81" y2="81" stroke="var(--muted)" stroke-dasharray="10 10"/>
     ${ticks}
     <line x1="40" x2="${cx}" y1="58" y2="58" stroke="var(--amber)" stroke-width="3"/>
     <text x="${Math.max(40,cx/2+20)}" y="50" text-anchor="middle" class="t-a">s = ${fmt(dist,0)} m</text>
     <g transform="translate(${cx-46},62)"><rect x="0" y="6" width="46" height="16" rx="5" fill="var(--rust)"/><path d="M8,6 L14,-2 L32,-2 L40,6 Z" fill="var(--rust)"/><circle cx="11" cy="23" r="5" fill="var(--text)"/><circle cx="36" cy="23" r="5" fill="var(--text)"/></g>
     ${grid}
     <text x="70" y="156" class="t-m">dráha s (m)</text>
     <line x1="${gx(0)}" y1="${gy(0)}" x2="${gx(60)}" y2="${gy(Math.min(vm*60,MAX))}" stroke="var(--amber)" stroke-width="2.5" opacity=".55"/>
     <line x1="${gx(0)}" y1="${gy(0)}" x2="${gx(s.t)}" y2="${gy(dist)}" stroke="var(--amber)" stroke-width="3.5"/>
     <circle cx="${gx(s.t)}" cy="${gy(dist)}" r="6" fill="var(--amber-2)"/>`+'</svg>';
   const out=`${F(`${I('v')}${E}${fmt(s.v)} km/h${E}${fr(fmt(s.v),'3,6')} m/s ≐ ${fmt(vm,2)} m/s`)}
    ${F(`${I('s')}${E}${I('v')}${D}${I('t')}${E}${fmt(vm,2)} m/s${D}${s.t} s${E}<b>${fmt(dist,0)} m</b>`)}`;
   return {svg,out};
  }}
},
/* 4 ---------- MOMENT SÍLY ---------- */
{id:'moment-sily',group:'g3',name:'Moment síly',formula:`${I('M')}${E}${I('F')}${D}${I('a')}`,
 short:'Otáčivý účinek síly. Čím delší rameno, tím menší síla stačí.',
 symbols:[[I('M'),'moment síly','N·m (newtonmetr)'],[I('F'),'síla','N'],[I('a'),'rameno síly','m']],
 theory:`<p>Některé věci se pod silou neposunou, ale <strong>otočí</strong> – dveře, klíč na matici, volant, kohoutek. Jak silně se věc otáčí, popisuje <strong>moment síly</strong> ${F(I('M'))}.</p>
 <p>Moment nezáleží jen na síle, ale i na tom, <strong>jak daleko od osy otáčení</strong> působíš. Tahle vzdálenost se jmenuje <strong>rameno síly</strong> ${F(I('a'))}. Měříme ji od osy kolmo k síle.</p>
 <p>Zkus si zavřít dveře tlakem u pantů a pak u kliky. U pantů musíš tlačit hrozně silně, u kliky stačí lehce. Stejný moment dostaneš <strong>velkou silou na krátkém rameni</strong>, nebo <strong>malou silou na dlouhém rameni</strong>.</p>`,
 remember:['Rameno vždy převeď na metry: 25 cm = 0,25 m.','Dvakrát delší rameno = poloviční síla stačí.','Jednotka N·m se čte „newtonmetr“.'],
 life:'Klika je na dveřích co nejdál od pantů. Mechanik si na utaženou matici nasadí na klíč trubku. Na kole šlapeš na pedál na dlouhé klice.',
 rearr:[{q:I('M'),f:`${I('M')}${E}${I('F')}${D}${I('a')}`,how:'Původní vzorec – síla krát rameno.'},
        {q:I('F'),f:`${I('F')}${E}${fr(I('M'),I('a'))}`,how:'Obě strany vydělíme a.'},
        {q:I('a'),f:`${I('a')}${E}${fr(I('M'),I('F'))}`,how:'Obě strany vydělíme F.'}],
 examples:[
  {lvl:'Lehký',task:'Na konec tyče dlouhé 0,5 m působíme kolmo silou 20 N. Jaký je moment síly vzhledem k ose na druhém konci?',steps:[
    ['Zápis',`<div class="zapis">${F(I('F')+' = 20 N')}${F(I('a')+' = 0,5 m')}${F(I('M')+' = ? N·m')}</div>`],
    ['Vzorec',F(`${I('M')}${E}${I('F')}${D}${I('a')}`)],
    ['Dosazení',F(`${I('M')}${E}20${D}0,5`)],
    ['Výsledek',F(`${I('M')}${E}10 N·m`)],
    ['Odpověď','Moment síly je <strong>10 N·m</strong>.']]},
  {lvl:'Střední',task:'Klíč je dlouhý 25 cm. Na jeho konec tlačíš rukou silou 40 N. Jaký moment síly působí na matici?',steps:[
    ['Zápis',`<div class="zapis">${F(I('F')+' = 40 N')}${F(I('a')+' = 25 cm')}${F(I('M')+' = ? N·m')}</div>`],
    ['Převod',F('25 cm = 0,25 m')],
    ['Vzorec',F(`${I('M')}${E}${I('F')}${D}${I('a')}`)],
    ['Dosazení',F(`${I('M')}${E}40${D}0,25`)],
    ['Výsledek',F(`${I('M')}${E}10 N·m`)],
    ['Odpověď','Na matici působí moment <strong>10 N·m</strong>.']]},
  {lvl:'Náročnější',task:'Rezavá matice se povolí až při momentu 30 N·m. Klíč měří 20 cm. Jakou silou musíš tlačit? A jakou, když klíč prodloužíš trubkou na 60 cm?',steps:[
    ['Zápis',`<div class="zapis">${F(I('M')+' = 30 N·m')}${F(I('a')+' = 20 cm = 0,2 m')}${F(I('F')+' = ? N')}</div>`],
    ['Vzorec','Hledáme sílu:'+F(` ${I('F')}${E}${fr(I('M'),I('a'))}`)],
    ['Dosazení',F(`${I('F')}${E}${fr('30','0,2')}${E}150 N`)],
    ['S trubkou',F(`${I('a')}${E}0,6 m → ${I('F')}${E}${fr('30','0,6')}${E}50 N`)],
    ['Odpověď','S krátkým klíčem potřebuješ <strong>150 N</strong>, s trubkou jen <strong>50 N</strong>. Třikrát delší rameno, třikrát menší síla.']]}
 ],
 sim:{defs:[
   {type:'range',id:'F',label:'Síla ruky',min:0,max:200,step:5,value:60,unit:'N'},
   {type:'range',id:'a',label:'Délka klíče (rameno)',min:0.05,max:0.5,step:0.05,value:0.2,unit:'m'}],
  hint:'Matice se povolí až při momentu 20 N·m. Zkus to s malou silou a dlouhým klíčem, a pak naopak.',
  draw(s){
   const M=s.F*s.a, ok=M>=20, cx=110, cy=150, L=s.a*820, ex=cx+L, aL=16+s.F*.62;
   const hex=[...Array(6)].map((_,i)=>{const t=Math.PI/3*i+Math.PI/6;return `${cx+26*Math.cos(t)},${cy+26*Math.sin(t)}`}).join(' ');
   const pct=clamp(M/40,0,1);
   const svg=svgOpen(320)+
    `<rect x="60" y="100" width="100" height="100" rx="6" fill="var(--ground)" opacity=".6"/>
     <g class="${ok?'spin':''}"><polygon points="${hex}" fill="var(--m-alu)" stroke="var(--text)" stroke-opacity=".5"/><circle cx="${cx}" cy="${cy}" r="9" fill="var(--sim-bg)"/></g>
     <path d="M${cx},${cy-12} L${ex},${cy-8} L${ex},${cy+8} L${cx},${cy+12} Z" fill="var(--m-iron)" stroke="var(--text)" stroke-opacity=".35"/>
     <circle cx="${cx}" cy="${cy}" r="30" fill="none" stroke="var(--m-iron)" stroke-width="10"/>
     ${arrow(ex,cy-aL-2,ex,cy-2,'var(--rust)',5)}
     <text x="${Math.min(ex+10,520)}" y="${cy-aL/2}" class="t-f t-r">F<tspan style="font-style:normal;font-family:var(--font-ui);font-size:14px"> = ${s.F} N</tspan></text>
     <line x1="${cx}" x2="${ex}" y1="${cy+40}" y2="${cy+40}" stroke="var(--amber)" stroke-width="2"/>
     <line x1="${cx}" x2="${cx}" y1="${cy+32}" y2="${cy+48}" stroke="var(--amber)" stroke-width="2"/>
     <line x1="${ex}" x2="${ex}" y1="${cy+32}" y2="${cy+48}" stroke="var(--amber)" stroke-width="2"/>
     <text x="${(cx+ex)/2}" y="${cy+64}" text-anchor="middle" class="t-a">a = ${fmt(s.a,2)} m</text>
     <text x="${cx}" y="${cy-44}" text-anchor="middle" class="t-m">osa otáčení</text>
     <text x="40" y="262" class="t-m">moment síly</text>
     <rect x="40" y="272" width="520" height="16" rx="8" fill="var(--chip-h)"/>
     <rect x="40" y="272" width="${520*pct}" height="16" rx="8" fill="${ok?'var(--moss)':'var(--amber)'}"/>
     <line x1="300" x2="300" y1="266" y2="294" stroke="var(--text)" stroke-width="2"/>
     <text x="300" y="310" text-anchor="middle" class="t-m">20 N·m – matice povolí</text>`+'</svg>';
   const out=`${F(`${I('M')}${E}${I('F')}${D}${I('a')}${E}${s.F} N${D}${fmt(s.a,2)} m${E}<b>${fmt(M,2)} N·m</b>`)}
     <span>${ok?'<span class="badge b-succ"><span class="d"></span>Matice se točí!</span>':'<span class="badge b-warn"><span class="d"></span>Matice drží – potřebuješ aspoň 20 N·m</span>'}</span>`;
   return {svg,out};
  }}
},
/* 5 ---------- PÁKA ---------- */
{id:'paka',group:'g3',name:'Rovnováha sil na páce',formula:`${F1}${D}${a1}${E}${F2}${D}${a2}`,
 short:'Páka je v rovnováze, když jsou momenty sil na obou stranách stejné.',
 symbols:[[F1+', '+F2,'síly na levé a pravé straně','N'],[a1+', '+a2,'ramena sil (vzdálenost od osy)','m (nebo cm – na obou stranách stejně)']],
 theory:`<p>Představ si houpačku. Na jedné straně sedí táta, na druhé ty. Aby houpačka byla v rovnováze, musí táta sedět <strong>blíž k ose</strong>. Proč?</p>
 <p>Každá strana houpačky se snaží páku otočit na svou stranu – každá má svůj <strong>moment síly</strong> (síla × rameno). Páka je <strong>v rovnováze</strong>, když jsou oba momenty stejně velké:</p>
 <p>${F(`${F1}${D}${a1}${E}${F2}${D}${a2}`)}</p>
 <p>Takže <strong>větší síla potřebuje kratší rameno</strong> a menší síla delší rameno. Díky tomu umíme malou silou zvednout velké břemeno – stačí působit daleko od osy.</p>`,
 remember:['Těžší sedí blíž k ose.','Ramena mohou být v cm, jen musí být na obou stranách ve stejných jednotkách.','Když se ptají na hmotnost v kg, nejdřív spočítej sílu: F = m · g.'],
 life:'Houpačka, páčidlo, nůžky, kleště, louskáček, kolečko na zahradu, otvírák na lahve.',
 rearr:[{q:F1,f:`${F1}${E}${fr(F2+D+a2,a1)}`,how:'Obě strany vydělíme a₁.'},
        {q:a1,f:`${a1}${E}${fr(F2+D+a2,F1)}`,how:'Obě strany vydělíme F₁.'},
        {q:F2,f:`${F2}${E}${fr(F1+D+a1,a2)}`,how:'Obě strany vydělíme a₂.'},
        {q:a2,f:`${a2}${E}${fr(F1+D+a1,F2)}`,how:'Obě strany vydělíme F₂.'}],
 examples:[
  {lvl:'Lehký',task:'Na levé straně páky působí síla 30 N ve vzdálenosti 20 cm od osy. Jakou silou musíme působit vpravo ve vzdálenosti 30 cm, aby byla páka v rovnováze?',steps:[
    ['Zápis',`<div class="zapis">${F(F1+' = 30 N')}${F(a1+' = 20 cm')}${F(a2+' = 30 cm')}${F(F2+' = ? N')}</div>`],
    ['Vzorec',F(`${F1}${D}${a1}${E}${F2}${D}${a2}`)+' → '+F(`${F2}${E}${fr(F1+D+a1,a2)}`)],
    ['Dosazení',F(`${F2}${E}${fr('30 · 20','30')}${E}${fr('600','30')}`)],
    ['Výsledek',F(`${F2}${E}20 N`)],
    ['Odpověď','Vpravo musíme působit silou <strong>20 N</strong>. Ramena jsou obě v cm, takže převádět nemusíme.']]},
  {lvl:'Střední',task:'Tomáš (500 N) sedí na houpačce 1,2 m od osy. Kam si musí sednout Eliška (400 N), aby byla houpačka v rovnováze?',steps:[
    ['Zápis',`<div class="zapis">${F(F1+' = 500 N')}${F(a1+' = 1,2 m')}${F(F2+' = 400 N')}${F(a2+' = ? m')}</div>`],
    ['Vzorec',F(`${a2}${E}${fr(F1+D+a1,F2)}`)],
    ['Dosazení',F(`${a2}${E}${fr('500 · 1,2','400')}${E}${fr('600','400')}`)],
    ['Výsledek',F(`${a2}${E}1,5 m`)],
    ['Odpověď','Eliška si musí sednout <strong>1,5 m</strong> od osy – dál než Tomáš, protože je lehčí.']]},
  {lvl:'Náročnější',task:'Páčidlem dlouhým 1,5 m zvedáme kámen o hmotnosti 120 kg. Podpěra (osa) je 0,3 m od konce pod kamenem. Jakou silou musíme tlačit na druhý konec páčidla?',steps:[
    ['Zápis',`<div class="zapis">${F(I('m')+' = 120 kg')}${F(a1+' = 0,3 m')}${F(a2+' = 1,5 − 0,3 = 1,2 m')}${F(F2+' = ? N')}</div>`],
    ['Síla kamene','Nejdřív spočítáme gravitační sílu kamene:'+F(` ${F1}${E}${I('m')}${D}${I('g')}${E}120${D}10${E}1 200 N`)],
    ['Vzorec',F(`${F2}${E}${fr(F1+D+a1,a2)}`)],
    ['Dosazení',F(`${F2}${E}${fr('1 200 · 0,3','1,2')}${E}${fr('360','1,2')}`)],
    ['Výsledek',F(`${F2}${E}300 N`)],
    ['Odpověď','Stačí tlačit silou <strong>300 N</strong> – čtyřikrát menší, než je tíha kamene, protože rameno ruky je čtyřikrát delší.']]}
 ],
 sim:{defs:[
   {type:'range',id:'m1',label:'Levá strana – hmotnost',min:5,max:60,step:5,value:40,unit:'kg'},
   {type:'range',id:'a1',label:'Levá strana – vzdálenost od osy',min:0.5,max:3,step:0.25,value:1.5,unit:'m'},
   {type:'range',id:'m2',label:'Pravá strana – hmotnost',min:5,max:60,step:5,value:30,unit:'kg'},
   {type:'range',id:'a2',label:'Pravá strana – vzdálenost od osy',min:0.5,max:3,step:0.25,value:2,unit:'m'}],
  hint:'Začínáš v rovnováze: 40 kg na 1,5 m a 30 kg na 2 m. Zkus najít další dvojice, které houpačku vyrovnají.',
  draw(s){
   const f1=s.m1*10,f2=s.m2*10,M1=f1*s.a1,M2=f2*s.a2,diff=M2-M1, ang=Math.abs(diff)<1?0:10*Math.tanh(diff/250);
   const k=80, px=300, py=210;
   const box=(x,m,c)=>{const w=18+Math.sqrt(m)*5;return `<rect x="${x-w/2}" y="${py-6-w}" width="${w}" height="${w}" rx="4" fill="${c}" stroke="var(--text)" stroke-opacity=".3"/><text x="${x}" y="${py-14-w}" text-anchor="middle" class="t-a" style="font-size:13px">${m} kg</text>`};
   let ticks=''; for(let d=-3;d<=3;d+=0.5){ if(d===0) continue; ticks+=`<line x1="${px+d*k}" x2="${px+d*k}" y1="${py-2}" y2="${py+(Number.isInteger(d)?8:5)}" stroke="var(--muted)"/>`; if(Number.isInteger(d)) ticks+=`<text x="${px+d*k}" y="${py+22}" text-anchor="middle" class="t-m">${Math.abs(d)} m</text>`;}
   const svg=svgOpen(320)+
    `<g transform="rotate(${ang} ${px} ${py})">
      <rect x="${px-3*k-10}" y="${py-6}" width="${6*k+20}" height="12" rx="4" fill="var(--m-wood)"/>
      ${ticks}
      ${box(px-s.a1*k,s.m1,'var(--rust)')}
      ${box(px+s.a2*k,s.m2,'var(--info)')}
      ${arrow(px-s.a1*k,py+30,px-s.a1*k,py+30+f1*.12,'var(--rust)',4)}
      ${arrow(px+s.a2*k,py+30,px+s.a2*k,py+30+f2*.12,'var(--info)',4)}
     </g>
     <polygon points="${px},${py+6} ${px-22},${py+64} ${px+22},${py+64}" fill="var(--ground)"/>
     <line x1="40" x2="560" y1="${py+64}" y2="${py+64}" stroke="var(--muted)"/>
     <text x="40" y="34" class="t-r">M₁ = ${f1} N · ${fmt(s.a1)} m = ${fmt(M1)} N·m</text>
     <text x="560" y="34" text-anchor="end" class="t-i">M₂ = ${f2} N · ${fmt(s.a2)} m = ${fmt(M2)} N·m</text>`+'</svg>';
   const st= diff===0?'<span class="badge b-succ"><span class="d"></span>Rovnováha!</span>': diff<0?'<span class="badge b-warn"><span class="d"></span>Převažuje levá strana</span>':'<span class="badge b-info"><span class="d"></span>Převažuje pravá strana</span>';
   const out=`${F(`${F1}${D}${a1}${E}${f1}${D}${fmt(s.a1)}${E}${fmt(M1)} N·m`)}${F(`${F2}${D}${a2}${E}${f2}${D}${fmt(s.a2)}${E}${fmt(M2)} N·m`)}<span>${st}</span><span class="note">Síly počítáme jako F = m · g, tedy kilogramy × 10.</span>`;
   return {svg,out};
  }}
},
/* 6 ---------- TLAK ---------- */
{id:'tlak',group:'g4',name:'Tlak',formula:`${I('p')}${E}${fr(I('F'),I('S'))}`,
 short:'Jak moc se síla soustředí na plochu. Malá plocha = velký tlak.',
 symbols:[[I('p'),'tlak','Pa (pascal) = N/m²'],[I('F'),'tlaková síla (kolmo na plochu)','N'],[I('S'),'obsah plochy','m²']],
 theory:`<p>Proč se v hlubokém sněhu bez lyží propadáš, ale na lyžích ne? Tvoje síla je pořád stejná. Změnila se jen <strong>plocha</strong>, na kterou ji rozložíš.</p>
 <p><strong>Tlak</strong> říká, <strong>jaká síla připadá na 1 m² plochy</strong>. Proto dělíme sílu plochou: ${F(`${I('p')}${E}${fr(I('F'),I('S'))}`)}.</p>
 <ul><li><strong>Malá plocha → velký tlak.</strong> Hřebík, jehla, nůž, jehlový podpatek.</li>
 <li><strong>Velká plocha → malý tlak.</strong> Lyže, sněžnice, pásy bagru, široké pneumatiky traktoru.</li></ul>
 <p>Jednotka je <strong>pascal</strong> (Pa) – to je tlak 1 N na 1 m². Je to malý tlak, proto se často používá <strong>kilopascal</strong>: 1 kPa = 1 000 Pa.</p>`,
 remember:['1 m² = 10 000 cm²  → 300 cm² = 0,03 m²','1 kPa = 1 000 Pa, 1 MPa = 1 000 000 Pa','Plochu převeď na m² ještě před dosazením.','Když stojíš na jedné noze, tlak se zdvojnásobí.'],
 life:'Ostrý nůž krájí lépe než tupý. Batoh s širokými popruhy netlačí. Pod kola auta zapadlého v blátě dáváme prkna.',
 rearr:[{q:I('p'),f:`${I('p')}${E}${fr(I('F'),I('S'))}`,how:'Původní vzorec – síla děleno plochou.'},
        {q:I('F'),f:`${I('F')}${E}${I('p')}${D}${I('S')}`,how:'Obě strany vynásobíme S.'},
        {q:I('S'),f:`${I('S')}${E}${fr(I('F'),I('p'))}`,how:'Z F = p · S vydělíme obě strany p.'}],
 examples:[
  {lvl:'Lehký',task:'Krabice působí na podlahu silou 200 N. Leží na ploše 0,5 m². Jaký tlak vytváří?',steps:[

    ['Zápis',`<div class="zapis">${F(I('p')+' = 10 kPa = 10 000 Pa')}${F(I('F')+' = 800 N')}${F(I('S')+' = ? '+m2)}</div>`],
    ['Vzorec','Hledáme plochu:'+F(` ${I('S')}${E}${fr(I('F'),I('p'))}`)],

    ['Porovnání','Boty mají jen 300 cm², to je méně než potřebných 800 cm². Tlak by byl:'+F(` ${fr('800','0,03')} ≐ 26 667 Pa`)+' – víc než 10 kPa.'],
    ['Odpověď','Opora musí mít aspoň <strong>800 cm² (0,08 m²)</strong>. V botách by se led <strong>prolomil</strong>, rybář potřebuje třeba široké prkno nebo sněžnice.']]}
 ],
 sim:{defs:[
   {type:'range',id:'F',label:'Síla (tíha člověka)',min:100,max:1000,step:50,value:500,unit:'N'},
   {type:'seg',id:'S',label:'Na čem stojí?',value:300,options:[['Sněžnice 2 000 cm²',2000],['Dvě boty 300 cm²',300],['Jedna bota 150 cm²',150],['Podpatek 2 cm²',2]]}],
  hint:'Nech stejnou sílu a měň jen plochu. Hloubka stopy ve sněhu ukazuje, jak velký je tlak.',
  draw(s){
   const Sm=s.S/10000, p=s.F/Sm, depth=clamp(6+28*(Math.log10(p)-3.3),3,110);
   const w=clamp(12+4.4*Math.sqrt(s.S),14,220), x=300-w/2, top=150+depth;
   const svg=svgOpen(320)+
    `<rect x="20" y="150" width="560" height="150" fill="var(--snow)" opacity=".85"/>
     <rect x="${x-3}" y="150" width="${w+6}" height="${depth}" fill="var(--sim-bg)"/>
     <line x1="20" x2="580" y1="150" y2="150" stroke="var(--muted)"/>
     <rect x="${x}" y="${top-26}" width="${w}" height="26" rx="4" fill="var(--rust)"/>
     <rect x="${300-28}" y="${top-96}" width="56" height="70" rx="8" fill="var(--btn)"/>
     ${arrow(300,22,300,top-100,'var(--amber)',5)}
     <text x="312" y="50" class="t-f t-a">F<tspan style="font-style:normal;font-family:var(--font-ui);font-size:14px"> = ${s.F} N</tspan></text>
     <text x="${300+w/2+12}" y="${top-8}" class="t-m">S = ${fmt(s.S)} cm²</text>
     <line x1="${x-14}" x2="${x-14}" y1="150" y2="${150+depth}" stroke="var(--rust)" stroke-width="2"/>
     <text x="${x-20}" y="${150+depth/2+4}" text-anchor="end" class="t-r" style="font-size:13px">boří se</text>
     <text x="30" y="290" class="t-m" style="fill:#7a5a40">sníh</text>`+'</svg>';
   const kind=p<5000?['b-succ','Neboříš se']:p<40000?['b-info','Trochu se boříš']:['b-warn','Zapadáš hluboko!'];
   const out=`${F(`${I('p')}${E}${fr(I('F'),I('S'))}${E}${fr(s.F+' N',fmt(Sm,4)+' m<sup>2</sup>')}${E}<b>${fmt(p,0)} Pa</b>`)}
    <span class="note">To je ${fmt(p/1000,1)} kPa. &nbsp;<span class="badge ${kind[0]}"><span class="d"></span>${kind[1]}</span></span>`;
   return {svg,out};
  }}
},
/* 7 ---------- HYDRAULIKA ---------- */
{id:'hydraulika',group:'g4',name:'Hydraulické zařízení',formula:`${fr(F1,S1)}${E}${fr(F2,S2)}`,
 short:'Malou silou na malém pístu vyvoláš velkou sílu na velkém pístu.',
 symbols:[[F1+', '+S1,'síla a plocha malého pístu','N, cm² nebo m²'],[F2+', '+S2,'síla a plocha velkého pístu','N, cm² nebo m²']],
 theory:`<p>Kapalina se nedá stlačit. Když zatlačíš na kapalinu v uzavřené nádobě, tlak se rozšíří <strong>všemi směry stejně</strong> – to je <strong>Pascalův zákon</strong>.</p>
 <p>Hydraulické zařízení má dva písty spojené kapalinou: malý a velký. Tlak pod oběma je stejný. Protože tlak je ${F(fr(I('F'),I('S')))}, platí:</p>
 <p>${F(`${fr(F1,S1)}${E}${fr(F2,S2)}`)}</p>
 <p>Jednoduše: <strong>kolikrát je velký píst větší, tolikrát větší sílu dostaneš</strong>. Velký píst 50× větší než malý = síla 50× větší.</p>
 <p>Ale nic není zadarmo. Malý píst musíš stlačit hodně, zatímco velký se zvedne jen trochu – zase tolikrát méně.</p>`,
 remember:['Plochy stačí mít obě ve stejných jednotkách (třeba obě v cm²).','Poměr ploch = poměr sil.','Malý píst se posune víc, velký méně.'],
 life:'Zvedák v autoservisu, brzdy auta, ramena bagru, hydraulický lis, kancelářská židle s pístem.',
 rearr:[{q:F2,f:`${F2}${E}${fr(F1+D+S2,S1)}`,how:'Obě strany vynásobíme S₂.'},
        {q:F1,f:`${F1}${E}${fr(F2+D+S1,S2)}`,how:'Obě strany vynásobíme S₁.'},
        {q:S2,f:`${S2}${E}${fr(F2+D+S1,F1)}`,how:'Převrátíme oba zlomky (S/F) a vynásobíme F₂.'},
        {q:S1,f:`${S1}${E}${fr(F1+D+S2,F2)}`,how:'Převrátíme oba zlomky (S/F) a vynásobíme F₁.'}],
 examples:[
  {lvl:'Lehký',task:'Malý píst má plochu 10 cm², velký 100 cm². Na malý píst tlačíme silou 50 N. Jak velká síla působí na velký píst?',steps:[
    ['Zápis',`<div class="zapis">${F(S1+' = 10 '+cm2)}${F(S2+' = 100 '+cm2)}${F(F1+' = 50 N')}${F(F2+' = ? N')}</div>`],
    ['Vzorec',F(`${F2}${E}${fr(F1+D+S2,S1)}`)],
    ['Dosazení',F(`${F2}${E}${fr('50 · 100','10')}`)],
    ['Výsledek',F(`${F2}${E}500 N`)],
    ['Odpověď','Na velký píst působí síla <strong>500 N</strong>. Plocha je 10× větší, tak i síla je 10× větší.']]},
  {lvl:'Střední',task:'Hydraulický zvedák má malý píst s plochou 4 cm² a velký píst s plochou 240 cm². Jakou silou musíme tlačit na malý píst, abychom zvedli auto, které působí silou 12 000 N?',steps:[
    ['Zápis',`<div class="zapis">${F(S1+' = 4 '+cm2)}${F(S2+' = 240 '+cm2)}${F(F2+' = 12 000 N')}${F(F1+' = ? N')}</div>`],
    ['Vzorec',F(`${F1}${E}${fr(F2+D+S1,S2)}`)],
    ['Dosazení',F(`${F1}${E}${fr('12 000 · 4','240')}${E}${fr('48 000','240')}`)],
    ['Výsledek',F(`${F1}${E}200 N`)],
    ['Odpověď','Stačí tlačit silou <strong>200 N</strong> – jako bys zvedal tašku s 20 kg.']]},
  {lvl:'Náročnější',task:'Na malý píst lisu (2 cm²) tlačíme silou 150 N. Lis má vyvinout sílu 9 000 N. Jakou plochu musí mít velký píst? O kolik se velký píst zvedne, když malý stlačíme o 30 cm?',steps:[
    ['Zápis',`<div class="zapis">${F(S1+' = 2 '+cm2)}${F(F1+' = 150 N')}${F(F2+' = 9 000 N')}${F(S2+' = ? '+cm2)}</div>`],
    ['Vzorec',F(`${S2}${E}${fr(F2+D+S1,F1)}`)],
    ['Dosazení',F(`${S2}${E}${fr('9 000 · 2','150')}${E}120 ${cm2}`)],
    ['Posun pístu','Malý píst vytlačí kapalinu o objemu'+F(` 2 ${cm2} · 30 cm = 60 ${cm3}`)+'. Ta se rozlije pod velký píst:'+F(` ${fr('60 '+cm3,'120 '+cm2)}${E}0,5 cm`)],
    ['Odpověď','Velký píst musí mít plochu <strong>120 cm²</strong>. Zvedne se jen o <strong>0,5 cm</strong> – síla je 60× větší, posun 60× menší.']]}
 ],
 sim:{defs:[
   {type:'range',id:'F1',label:'Síla na malý píst',min:10,max:200,step:10,value:100,unit:'N'},
   {type:'range',id:'S1',label:'Plocha malého pístu',min:1,max:20,step:1,value:5,unit:'cm²'},
   {type:'range',id:'S2',label:'Plocha velkého pístu',min:20,max:400,step:10,value:400,unit:'cm²'},
   {type:'range',id:'d',label:'Stlačení malého pístu',min:0,max:20,step:1,value:0,unit:'cm'},
   {type:'play',target:'d',label:'Zatlačit na píst',duration:3500}],
  hint:'Úkol: zvedni auto (10 000 N). Nastav plochy a sílu tak, aby F₂ stačila, pak zatlač na píst.',
  draw(s){
   const f2=s.F1*s.S2/s.S1, lift=f2>=10000, w1=10*Math.sqrt(s.S1)+6, w2=8*Math.sqrt(s.S2)+10, c1=100, c2=320;
   const d1=lift?s.d*5:0, d2=lift?d1*s.S1/s.S2:0;
   const top1=110+d1, top2=150-d2, bot=270;
   const liquid=`<path d="M${c1-w1/2},${top1+10} L${c1-w1/2},${bot} L${c2+w2/2},${bot} L${c2+w2/2},${top2+10} L${c2-w2/2},${top2+10} L${c2-w2/2},${bot-30} L${c1+w1/2},${bot-30} L${c1+w1/2},${top1+10} Z" fill="var(--water)"/>`;
   const walls=`<path d="M${c1-w1/2},60 L${c1-w1/2},${bot} L${c2+w2/2},${bot} L${c2+w2/2},90 M${c2-w2/2},90 L${c2-w2/2},${bot-30} L${c1+w1/2},${bot-30} L${c1+w1/2},60" fill="none" stroke="var(--muted)" stroke-width="3"/>`;
   const car=`<g transform="translate(${c2-45},${top2-34})"><rect x="0" y="10" width="90" height="22" rx="7" fill="var(--rust)"/><path d="M16,10 L28,-6 L62,-6 L76,10 Z" fill="var(--rust)"/><circle cx="20" cy="32" r="8" fill="var(--text)"/><circle cx="70" cy="32" r="8" fill="var(--text)"/></g>`;
   const svg=svgOpen(320)+
    `${liquid}${walls}
     <rect x="${c1-w1/2+1}" y="${top1}" width="${w1-2}" height="10" fill="var(--m-iron)"/>
     <rect x="${c2-w2/2+1}" y="${top2}" width="${w2-2}" height="10" fill="var(--m-iron)"/>
     ${car}
     ${arrow(c1,top1-70,c1,top1-4,'var(--amber)',5)}
     <text x="${c1+14}" y="${top1-40}" class="t-a">F₁ = ${s.F1} N</text>
     ${arrow(c2+w2/2+30,bot-10,c2+w2/2+30,top2+4,'var(--moss)',5)}
     <text x="${c2+w2/2+42}" y="${(top2+bot)/2}" style="fill:var(--moss);font-weight:700">F₂ = ${fmt(f2,0)} N</text>
     <text x="${c1}" y="300" text-anchor="middle" class="t-m">S₁ = ${s.S1} cm²</text>
     <text x="${c2}" y="300" text-anchor="middle" class="t-m">S₂ = ${s.S2} cm²</text>
     <text x="${c2}" y="${top2-48}" text-anchor="middle" class="t-m">auto 10 000 N</text>`+'</svg>';
   const st=lift?'<span class="badge b-succ"><span class="d"></span>Síla stačí – auto jde nahoru</span>':'<span class="badge b-warn"><span class="d"></span>Málo – auto se nehne</span>';
   const out=`${F(`${F2}${E}${fr(F1+D+S2,S1)}${E}${fr(s.F1+' · '+s.S2,s.S1)}${E}<b>${fmt(f2,0)} N</b>`)}<span>${st}</span>
    <span class="note">${lift&&s.d>0?`Malý píst jsi stlačil o ${s.d} cm, velký se zvedl jen o ${fmt(s.d*s.S1/s.S2,2)} cm.`:'Velký píst je '+fmt(s.S2/s.S1,1)+'× větší, proto je i síla '+fmt(s.S2/s.S1,1)+'× větší.'}</span>`;
   return {svg,out};
  }}
},
/* 8 ---------- HYDROSTATICKÝ TLAK ---------- */
{id:'hydrostaticky-tlak',group:'g5',name:'Hydrostatický tlak',formula:`${ph}${E}${I('h')}${D}${r}${D}${I('g')}`,
 short:'Tlak v kapalině roste s hloubkou. Čím hlouběji, tím víc tlačí.',
 symbols:[[ph,'hydrostatický tlak','Pa'],[I('h'),'hloubka pod hladinou','m'],[r,'hustota kapaliny','kg/m³'],[I('g'),'gravitační konstanta','10 N/kg']],
 theory:`<p>Kapalina má hmotnost, a proto ji Země přitahuje. Horní vrstvy vody tlačí na ty spodní. Čím jsi hlouběji, tím víc vody je nad tebou a tím větší je tlak. Tomu říkáme <strong>hydrostatický tlak</strong>.</p>
 <p>Záleží na třech věcech: <strong>hloubce</strong> ${F(I('h'))}, <strong>hustotě kapaliny</strong> ${F(r)} (rtuť tlačí víc než voda) a na ${F(I('g'))}.</p>
 <p>Zajímavost: <strong>nezáleží na tvaru ani velikosti nádoby</strong>. V hloubce 2 m je stejný tlak ve vaně i v moři (pokud je v nich stejná kapalina).</p>
 <p>V každé hloubce tlačí kapalina <strong>všemi směry</strong> – i do stran. Proto voda z otvoru ve stěně stříká, a z nižšího otvoru stříká dál.</p>`,
 remember:['Hloubka se měří od hladiny dolů, vždy v metrech.','Každých 10 m vody přidá asi 100 kPa.','ρ je hustota kapaliny (voda 1 000 kg/m³).'],
 life:'Bolí tě uši, když se potopíš na dno bazénu. Přehradní hráz je dole širší než nahoře. Ponorky musí mít silné stěny.',
 rearr:[{q:ph,f:`${ph}${E}${I('h')}${D}${r}${D}${I('g')}`,how:'Původní vzorec – hloubka × hustota × 10.'},
        {q:I('h'),f:`${I('h')}${E}${fr(ph,r+D+I('g'))}`,how:'Obě strany vydělíme ρ · g.'},
        {q:r,f:`${r}${E}${fr(ph,I('h')+D+I('g'))}`,how:'Obě strany vydělíme h · g.'}],
 examples:[
  {lvl:'Lehký',task:'Jaký hydrostatický tlak je ve vodě v hloubce 2 m? (ρ vody = 1 000 kg/m³)',steps:[
    ['Zápis',`<div class="zapis">${F(I('h')+' = 2 m')}${F(r+' = 1 000 kg/'+m3)}${F(I('g')+' = 10 N/kg')}${F(ph+' = ? Pa')}</div>`],
    ['Vzorec',F(`${ph}${E}${I('h')}${D}${r}${D}${I('g')}`)],
    ['Dosazení',F(`${ph}${E}2${D}1 000${D}10`)],
    ['Výsledek',F(`${ph}${E}20 000 Pa${E}20 kPa`)],
    ['Odpověď','V hloubce 2 m je hydrostatický tlak <strong>20 kPa</strong>.']]},
  {lvl:'Střední',task:'Potápěčka se ponořila v moři do hloubky 30 m. Jaký tlak na ni působí od vody? (ρ mořské vody = 1 030 kg/m³)',steps:[
    ['Zápis',`<div class="zapis">${F(I('h')+' = 30 m')}${F(r+' = 1 030 kg/'+m3)}${F(ph+' = ? kPa')}</div>`],
    ['Vzorec',F(`${ph}${E}${I('h')}${D}${r}${D}${I('g')}`)],
    ['Dosazení',F(`${ph}${E}30${D}1 030${D}10`)],
    ['Výsledek',F(`${ph}${E}309 000 Pa${E}309 kPa`)],
    ['Odpověď','Na potápěčku působí hydrostatický tlak <strong>309 kPa</strong> – asi třikrát víc, než je tlak vzduchu.']]},
  {lvl:'Náročnější',task:'Senzor na dně jezera naměřil hydrostatický tlak 150 kPa. Jak hluboké je jezero v tom místě?',steps:[
    ['Zápis',`<div class="zapis">${F(ph+' = 150 kPa = 150 000 Pa')}${F(r+' = 1 000 kg/'+m3)}${F(I('h')+' = ? m')}</div>`],
    ['Vzorec','Hledáme hloubku:'+F(` ${I('h')}${E}${fr(ph,r+D+I('g'))}`)],
    ['Dosazení',F(`${I('h')}${E}${fr('150 000','1 000 · 10')}${E}${fr('150 000','10 000')}`)],
    ['Výsledek',F(`${I('h')}${E}15 m`)],
    ['Odpověď','Jezero je v tom místě hluboké <strong>15 m</strong>.']]}
 ],
 sim:{defs:[
   {type:'seg',id:'rho',label:'Kapalina',value:1000,options:[['Voda',1000],['Mořská voda',1030],['Olej',900],['Líh',790],['Rtuť',13600]]},
   {type:'range',id:'h',label:'Hloubka sondy',min:0,max:10,step:0.5,value:4,unit:'m'}],
  hint:'Posouvej sondu dolů. A všimni si proudů z otvorů: čím níž je otvor, tím dál voda stříká.',
  draw(s){
   const p=s.h*s.rho*10, col={1000:'var(--water)',1030:'var(--m-sea)',900:'var(--m-oil)',790:'var(--m-alc)',13600:'var(--m-hg)'}[s.rho];
   const top=40, k=22, x0=70, x1=300, y=top+s.h*k;
   let marks=''; for(let d=0;d<=10;d+=2) marks+=`<line x1="${x0-8}" x2="${x0}" y1="${top+d*k}" y2="${top+d*k}" stroke="var(--muted)"/><text x="${x0-12}" y="${top+d*k+4}" text-anchor="end" class="t-m">${d} m</text>`;
   let jets=''; [2,5,8].forEach(d=>{const yy=top+d*k, L=24*Math.sqrt(d)*3.2;
     jets+=`<path d="M${x1},${yy} Q${x1+L*.7},${yy-4} ${x1+L},${Math.min(yy+90,305)}" fill="none" stroke="var(--water-line)" stroke-width="4" stroke-linecap="round" opacity=".75"/>`;});
   const svg=svgOpen(320)+
    `<rect x="${x0}" y="${top}" width="${x1-x0}" height="${10*k}" fill="${col}"/>
     <path d="M${x0},20 L${x0},${top+10*k} L${x1},${top+10*k} L${x1},20" fill="none" stroke="var(--muted)" stroke-width="3"/>
     ${marks}${jets}
     <line x1="${x0}" x2="${x1}" y1="${top}" y2="${top}" stroke="var(--water-line)" stroke-width="2"/>
     <line x1="185" x2="185" y1="${top}" y2="${y}" stroke="var(--amber)" stroke-dasharray="5 4" stroke-width="2"/>
     <circle cx="185" cy="${y}" r="10" fill="var(--amber)"/>
     <text x="200" y="${y-12}" class="t-a">h = ${fmt(s.h,1)} m</text>
     <rect x="440" y="${290-Math.min(200,p/136000*200+2)}" width="60" height="${Math.min(200,p/136000*200+2)}" rx="4" fill="var(--rust)"/>
     <line x1="430" x2="510" y1="290" y2="290" stroke="var(--muted)"/>
     <text x="470" y="${282-Math.min(200,p/136000*200+2)}" text-anchor="middle" class="t-r">${fmt(p/1000,1)} kPa</text>
     <text x="470" y="310" text-anchor="middle" class="t-m">tlak u sondy</text>`+'</svg>';
   const out=`${F(`${ph}${E}${I('h')}${D}${r}${D}${I('g')}${E}${fmt(s.h,1)}${D}${fmt(s.rho)}${D}10${E}<b>${fmt(p,0)} Pa</b>`)}<span class="note">To je ${fmt(p/1000,1)} kPa.${s.rho===13600?' Rtuť je 13,6× hustší než voda, proto tlačí 13,6× víc.':''}</span>`;
   return {svg,out};
  }}

/* ---------- ÚLOHY NA VYJÁDŘENÍ NEZNÁMÉ ---------- */
const cx=x=>`<span class="cx">${x}</span>`;
function prodLines(lhs,fs,t){
  const o=fs.filter(x=>x!==t), oj=o.join(D), oop=o.length>1?`(${oj})`:oj;
  const num=fs.map(x=>o.includes(x)?cx(x):x).join(D), den=o.map(cx).join(D);
  return [[`${lhs}${E}${fs.join(D)}`,`| : ${oop}`,`Hledané ${F(t)} je vynásobené ${o.length>1?'veličinami '+o.map(F).join(' a '):F(oj)}. Násobení zrušíme dělením – <strong>obě strany</strong> vydělíme ${F(oop)}.`],
          [`${fr(lhs,oj)}${E}${fr(num,den)}`,'',`Vpravo je ${o.length>1?F(oj):F(oj)} nahoře i dole, takže se zkrátí (dělit číslo samo sebou dá 1).`],
          [`${t}${E}${fr(lhs,oj)}`,'','Vpravo zůstalo samotné '+F(t)+'. Strany prohodíme, aby hledaná veličina byla vlevo.']];
}
function divLines(q,n,d){
  return {a:[[`${q}${E}${fr(n,d)}`,`| · ${d}`,`Hledané ${F(n)} je <strong>děleno</strong> ${F(d)}. Dělení zrušíme násobením – <strong>obě strany</strong> vynásobíme ${F(d)}.`],
             [`${q}${D}${d}${E}${fr(n+D+cx(d),cx(d))}`,'',`Vpravo je ${F(d)} nahoře i dole, takže se zkrátí.`],
             [`${n}${E}${q}${D}${d}`,'','Prohodíme strany a máme výsledek.']],
          b:[[`${n}${E}${q}${D}${d}`,`| : ${q}`,`Vyjdeme z výsledku a). Teď je ${F(d)} <strong>vynásobené</strong> ${F(q)}, proto obě strany vydělíme ${F(q)}.`],
             [`${fr(n,q)}${E}${fr(cx(q)+D+d,cx(q))}`,'',`Vpravo se ${F(q)} zkrátí.`],
             [`${d}${E}${fr(n,q)}`,'','Prohodíme strany a máme výsledek.']]};
}

function keySteps(k){
  const st=[];
  k.parts.forEach(([name,lines])=>lines.forEach((l,j)=>st.push([j===0?name:`${name.slice(0,2)} krok ${j+1}`,
    `<div class="der"><span class="f">${l[0]}</span>${l[1]?`<span class="op">${l[1]}</span>`:''}</div><div class="why">${l[2]}</div>`, j===lines.length-1?'fin':''])));
  st.push(['Zkouška',k.check]);
  st.push(['Výsledek',`<div class="der">${k.res.map(F).join('<span class="muted">a</span>')}</div>`]);
  return st;
}

      const inp=w.querySelector('input'), o=w.querySelector('output');
      const set=()=>{st[d.id]=+inp.value; o.textContent=fmt(st[d.id],2)+' '+d.unit;};
      inp.addEventListener('input',()=>{stopPlay();set();redraw();}); set();
    } else if(d.type==='seg'){
      st[d.id]=d.value;
      w.innerHTML=`<span class="lbl">${d.label}</span><div class="seg">${d.options.map(o=>`<button type="button" data-v="${o[1]}" aria-pressed="${o[1]===d.value}">${o[0]}</button>`).join('')}</div>`;
      w.querySelector('.seg').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b)return; st[d.id]=+b.dataset.v;
        w.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); redraw();});
    } else if(d.type==='play'){
      w.innerHTML=`<button class="btn" type="button">▶ ${d.label}</button>`;
      w.querySelector('button').addEventListener('click',()=>{
        stopPlay(); const t=sim.defs.find(x=>x.id===d.target), inp=$('#r-'+t.id); const t0=performance.now();
        const tick=now=>{const k=Math.min(1,(now-t0)/d.duration); const v=Math.round((t.min+(t.max-t.min)*k)/t.step)*t.step;
          inp.value=v; st[t.id]=v; $('#o-'+t.id).textContent=fmt(v,2)+' '+t.unit; redraw(); if(k<1) playTimer=requestAnimationFrame(tick);};
        playTimer=requestAnimationFrame(tick);
      });
    }
    ctrls.appendChild(w);
  });
  redraw();
}
function stopPlay(){ if(playTimer){cancelAnimationFrame(playTimer);playTimer=null;} }

function route(){
  stopPlay();
  const id=location.hash.slice(1); const c=CH.find(x=>x.id===id);
  c?chapter(c):dashboard();
  if(!c) window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ---------- motiv ---------- */
const root=document.documentElement;
const SUN='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const MOON='<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
function currentTheme(){ const t=root.getAttribute('data-theme'); if(t==='light'||t==='dark') return t; return matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'; }
function paintThemeBtn(){ const t=currentTheme(); $('#themeIcon').innerHTML=t==='dark'?SUN:MOON; $('#themeLbl').textContent=t==='dark'?'Světlý':'Tmavý'; }
const saved=store.get('theme'); if(saved==='light'||saved==='dark') root.setAttribute('data-theme',saved);
$('#themeBtn').addEventListener('click',()=>{const n=currentTheme()==='dark'?'light':'dark'; root.setAttribute('data-theme',n); store.set('theme',n); paintThemeBtn();});
matchMedia('(prefers-color-scheme: light)').addEventListener('change',paintThemeBtn);
paintThemeBtn();
route();
</script>
